<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background:#1f88b3;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .calculadora {
    background: #ece2d4;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    width: 340px;
    margin: auto;
}
    .pantalla{
        width:100%;
        height:70px;
        margin-bottom:15px;
        border:none;
        border-radius:12px;
        background:#f5f5f5;
        text-align:right;
        font-size:3rem;
        font-weight:bold;
        padding:10px;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
    }

    .botones {
    display: grid;
    grid-template-columns: repeat(4, 70px);
    grid-auto-rows: 55px;
    gap: 10px;
}

    button{
        border:none;
        border-radius:10px;
        font-size:1.6rem;
        cursor:pointer;
        transition:.2s;
        background:#bebebe;
        color:#222;
    }

    button:hover{
        transform:scale(1.05);
    }

    .operador{
        background:#8f8f8f;
        color:white;
    }

    .operador:hover{
        background:#777;
    }

    .limpiar{
        background:#8f8f8f;
        color:white;
    }

    .igual{
        background:#8f8f8f;
        color:white;
        grid-row: span 2;
    }

    .cero{
        grid-column: span 2;
    }
</style>
</head>
<body>

<div class="calculadora">

    <input type="text" id="pantalla" class="pantalla" readonly>

    <div class="botones">

        <button class="limpiar" onclick="limpiar()">C</button>
        <button class="limpiar" onclick="borrarUltimo()">CE</button>
        <button class="operador" onclick="agregar('/')">/</button>
        <button class="operador" onclick="agregar('*')">*</button>

        <button onclick="agregar('7')">7</button>
        <button onclick="agregar('8')">8</button>
        <button onclick="agregar('9')">9</button>
        <button class="operador" onclick="agregar('-')">-</button>

        <button onclick="agregar('4')">4</button>
        <button onclick="agregar('5')">5</button>
        <button onclick="agregar('6')">6</button>
        <button class="operador" onclick="agregar('+')">+</button>

        <button onclick="agregar('1')">1</button>
        <button onclick="agregar('2')">2</button>
        <button onclick="agregar('3')">3</button>
        <button class="igual" onclick="calcular()">=</button>

        <button class="cero" onclick="agregar('0')">0</button>
        <button onclick="agregar('.')">.</button>

    </div>

</div>

<script>

const pantalla = document.getElementById("pantalla");

function agregar(valor){
    pantalla.value += valor;
}

function limpiar(){
    pantalla.value = "";
}

function borrarUltimo(){
    pantalla.value = pantalla.value.slice(0,-1);
}

function calcular(){

    try{

        if(pantalla.value === ""){
            pantalla.value = "";
            return;
        }

        pantalla.value = eval(pantalla.value);

    }catch(error){

        pantalla.value = "Error";

        setTimeout(()=>{
            pantalla.value = "";
        },1500);

    }

}

</script>

</body>
</html>
